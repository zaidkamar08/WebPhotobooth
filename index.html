<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhotoBooth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <h1>📸 PhotoBooth</h1>

  <!-- Camera Area -->
  <div class="camera-box">
    <video id="video" autoplay></video>
  </div>

  <div class="filters">
  <button data-filter="none">Normal</button>
  <button data-filter="grayscale(100%)">B&W</button>
  <button data-filter="brightness(1.2) saturate(1.5)">Warm</button>
  <button data-filter="contrast(1.2) saturate(1.2)">Cool</button>
  <button data-filter="sepia(60%)">Vintage</button>
  <button data-filter="blur(3px)">Blur</button>
  <button data-filter="brightness(1.1) blur(1px) saturate(1.2)">Soft Glow</button>
<button data-filter="contrast(1.5) saturate(1.3)">Cinematic</button>
    <button data-filter="brightedness(0.5) saturate(2.2)">Random</button>

</div>


  <!-- Capture Button -->
  <button class="capture-btn" id="captureBtn">Capture</button>


  <div class="photos">
  <img class="slot">
  <img class="slot">
  <img class="slot">
  <img class="slot">
</div>


  <!-- Final Output -->
  <button class="download-btn" id="downloadBtn">Download Strip</button>
  <button class="download-btn" id="resetBtn">Start Again</button>



</div>
<script src="script.js"></script>


</body>
</html>
